<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Admins | ICT Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div id="page-content" class="hidden">
    <div class="shell-heading shell-heading-row">
      <div>
        <h1>Admins</h1>
        <p class="muted">Admins can view and download data but cannot change anything.</p>
      </div>
      <button type="button" class="btn btn-primary" id="add-admin"></button>
    </div>

    <div id="page-alert" aria-live="polite"></div>
    <p class="hint" id="admins-status" aria-live="polite"></p>

    <div class="table-wrap hidden" id="admins-wrap">
      <table class="table responsive students-table">
        <thead>
          <tr>
            <th>Name</th>
            <th>Email</th>
            <th>Status</th>
            <th>Last login</th>
            <th><span class="sr-only">Actions</span></th>
          </tr>
        </thead>
        <tbody id="admins-body"></tbody>
      </table>
    </div>
  </div>

  <script src="/js/ui.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/pages/admins.js"></script>
</body>
</html>
