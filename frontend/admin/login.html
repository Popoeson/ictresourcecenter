<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Admin log in | ICT Course Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div class="page">
    <header class="site-header">
      <a class="brand" href="/">ICT Course Portal</a>
      <a class="header-link" href="/admin/login.html" aria-current="page">Admin</a>
    </header>

    <div class="sheet-page sheet-narrow">
      <main>
        <h1 class="page-title">Admin log in</h1>
        <p class="lead">For course lecturers and staff.</p>

        <div id="form-alert" aria-live="polite"></div>

        <form id="login-form" novalidate>
          <div class="field">
            <label for="email">Email</label>
            <input class="input" id="email" type="email" autocomplete="username" autocapitalize="none" spellcheck="false">
          </div>
          <div class="field">
            <label for="password">Password</label>
            <div class="password-wrap">
              <input class="input" id="password" type="password" autocomplete="current-password">
              <button type="button" class="password-toggle" aria-label="Show password"></button>
            </div>
          </div>
          <button class="btn btn-primary btn-block" type="submit" id="login-btn">Log in</button>
        </form>

        <a class="text-link" href="/">Back to student site</a>
      </main>
    </div>

    <footer class="site-footer-line">
      <p>Need help? Contact your course lecturer. &copy; <span id="year"></span></p>
    </footer>
  </div>

  <script src="/js/ui.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/pages/login.js"></script>
</body>
</html>
