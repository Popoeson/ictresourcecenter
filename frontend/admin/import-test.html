<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Import test (temporary)</title>
  <style>
    body { font-family: system-ui, -apple-system, Arial, sans-serif; background: #F4F5F0; color: #1B1B1B; margin: 0; padding: 16px; }
    .card { background: #fff; border-radius: 16px; max-width: 640px; margin: 16px auto; padding: 16px; }
    input { width: 100%; box-sizing: border-box; font-size: 16px; padding: 12px; margin: 6px 0 12px; }
    button { font-size: 16px; padding: 12px 16px; border: 0; border-radius: 8px; background: #C9B893; color: #1B1B1B; }
    pre { background: #F8F9F4; padding: 12px; border-radius: 8px; white-space: pre-wrap; word-break: break-word; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Import test (temporary)</h2>
    <p>Log in first on <a href="/admin/auth-test.html">auth-test.html</a>.</p>
    <p><a href="/api/admin/import/template">Download the import template</a></p>
    <label>Excel (.xlsx) or CSV file</label>
    <input id="file" type="file" accept=".xlsx,.csv">
    <button onclick="upload()">Upload and import</button>
    <p id="links"></p>
  </div>
  <div class="card"><pre id="out">Result appears here.</pre></div>
  <script>
    function upload() {
      var out = document.getElementById('out');
      var links = document.getElementById('links');
      var f = document.getElementById('file').files[0];
      links.innerHTML = '';
      if (!f) { out.textContent = 'Choose a file first.'; return; }
      var fd = new FormData();
      fd.append('file', f);
      out.textContent = 'Uploading...';
      fetch('/api/admin/import', { method: 'POST', body: fd }).then(function (r) {
        return r.json().catch(function () { return {}; }).then(function (d) {
          out.textContent = r.status + '\n' + JSON.stringify(d, null, 2);
          if (d && d.data && d.data.hasErrorFile) {
            links.innerHTML = '<a href="/api/admin/import/' + d.data.batchId + '/errors">Download the rejected rows file</a>';
          }
        });
      }).catch(function () { out.textContent = 'Network error'; });
    }
  </script>
</body>
</html>
