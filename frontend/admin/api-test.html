<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>API test (temporary)</title>
  <style>
    body { font-family: system-ui, -apple-system, Arial, sans-serif; background: #F4F5F0; color: #1B1B1B; margin: 0; padding: 16px; }
    .card { background: #fff; border-radius: 16px; max-width: 640px; margin: 16px auto; padding: 16px; }
    input, select, textarea { width: 100%; box-sizing: border-box; font-size: 16px; padding: 12px; margin: 6px 0 12px; border: 1px solid #DCDCDC; border-radius: 8px; }
    button { font-size: 16px; padding: 12px 16px; border: 0; border-radius: 8px; background: #C9B893; color: #1B1B1B; }
    pre { background: #F8F9F4; padding: 12px; border-radius: 8px; white-space: pre-wrap; word-break: break-word; }
  </style>
</head>
<body>
  <div class="card">
    <h2>API test (temporary)</h2>
    <p>Log in first on <a href="/admin/auth-test.html">auth-test.html</a>, then come back here.</p>
    <label>Method</label>
    <select id="method">
      <option>GET</option><option>POST</option><option>PATCH</option><option>DELETE</option>
    </select>
    <label>Path</label>
    <input id="path" value="/api/admin/institutions">
    <label>JSON body (for POST and PATCH)</label>
    <textarea id="body" rows="5">{}</textarea>
    <button onclick="send()">Send</button>
  </div>
  <div class="card"><pre id="out">Result appears here.</pre></div>
  <script>
    function send() {
      var method = document.getElementById('method').value;
      var path = document.getElementById('path').value.trim();
      var out = document.getElementById('out');
      var opts = { method: method, headers: {} };
      if (method === 'POST' || method === 'PATCH') {
        opts.headers['Content-Type'] = 'application/json';
        opts.body = document.getElementById('body').value;
      }
      fetch(path, opts).then(function (r) {
        return r.json().catch(function () { return {}; }).then(function (d) {
          out.textContent = r.status + '\n' + JSON.stringify(d, null, 2);
        });
      }).catch(function () { out.textContent = 'Network error'; });
    }
  </script>
</body>
</html>
