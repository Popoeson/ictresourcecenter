<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Auth test (temporary)</title>
  <style>
    body { font-family: system-ui, -apple-system, Arial, sans-serif; background: #F4F5F0; color: #1B1B1B; margin: 0; padding: 16px; }
    .card { background: #fff; border-radius: 16px; max-width: 480px; margin: 16px auto; padding: 16px; }
    input { width: 100%; box-sizing: border-box; font-size: 16px; padding: 12px; margin: 6px 0 12px; border: 1px solid #DCDCDC; border-radius: 8px; }
    button { font-size: 16px; padding: 12px 16px; margin: 4px 4px 4px 0; border: 0; border-radius: 8px; background: #C9B893; color: #1B1B1B; }
    pre { background: #F8F9F4; padding: 12px; border-radius: 8px; white-space: pre-wrap; word-break: break-word; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Auth test (temporary)</h2>
    <label>Email</label>
    <input id="email" type="email" autocomplete="username">
    <label>Password</label>
    <input id="password" type="password" autocomplete="current-password">
    <button onclick="login()">Log in</button>
    <button onclick="call('GET','me')">Who am I</button>
    <button onclick="call('GET','_super-only')">Super Admin only</button>
    <button onclick="call('POST','logout')">Log out</button>
  </div>
  <div class="card">
    <h3>Change password</h3>
    <label>Current password</label>
    <input id="cur" type="password" autocomplete="off">
    <label>New password (10+ characters)</label>
    <input id="nw" type="password" autocomplete="off">
    <button onclick="change()">Change password</button>
  </div>
  <div class="card"><pre id="out">Result appears here.</pre></div>
  <script>
    var out = document.getElementById('out');
    function show(status, data) { out.textContent = status + '\n' + JSON.stringify(data, null, 2); }
    function call(method, path, body) {
      return fetch('/api/auth/' + path, {
        method: method,
        headers: body ? { 'Content-Type': 'application/json' } : {},
        body: body ? JSON.stringify(body) : undefined
      }).then(function (r) {
        return r.json().catch(function () { return {}; }).then(function (d) { show(r.status, d); });
      }).catch(function () { out.textContent = 'Network error'; });
    }
    function login() {
      call('POST', 'login', {
        email: document.getElementById('email').value,
        password: document.getElementById('password').value
      });
    }
    function change() {
      call('POST', 'change-password', {
        currentPassword: document.getElementById('cur').value,
        newPassword: document.getElementById('nw').value
      });
    }
  </script>
</body>
</html>
