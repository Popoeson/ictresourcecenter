<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Change password | ICT Course Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div class="page">
    <header class="site-header">
      <a class="brand" href="/">ICT Course Portal</a>
      <a class="header-link" href="/admin/login.html">Admin</a>
    </header>

    <div class="sheet-page sheet-narrow">
      <main id="page-content" class="hidden">
        <h1 class="page-title" id="cp-title">Change password</h1>
        <p class="lead" id="cp-lead">Choose a new password for your account.</p>

        <div id="form-alert" aria-live="polite"></div>

        <form id="cp-form" novalidate>
          <div class="field">
            <label for="cur">Current password</label>
            <div class="password-wrap">
              <input class="input" id="cur" type="password" autocomplete="current-password">
              <button type="button" class="password-toggle" aria-label="Show password"></button>
            </div>
          </div>
          <div class="field">
            <label for="nw">New password</label>
            <div class="password-wrap">
              <input class="input" id="nw" type="password" autocomplete="new-password">
              <button type="button" class="password-toggle" aria-label="Show password"></button>
            </div>
            <p class="hint">Use at least 10 characters.</p>
          </div>
          <div class="field">
            <label for="cf">Confirm new password</label>
            <div class="password-wrap">
              <input class="input" id="cf" type="password" autocomplete="new-password">
              <button type="button" class="password-toggle" aria-label="Show password"></button>
            </div>
          </div>
          <button class="btn btn-primary btn-block" type="submit" id="cp-btn">Save new password</button>
        </form>

        <a class="text-link hidden" id="cp-back" href="/admin/dashboard.html">Back to overview</a>
        <button class="text-link hidden" id="cp-logout" type="button">Log out</button>
      </main>
    </div>

    <footer class="site-footer-line">
      <p>Need help? Contact your course lecturer. &copy; <span id="year"></span></p>
    </footer>
  </div>

  <script src="/js/ui.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/pages/change-password.js"></script>
</body>
</html>
