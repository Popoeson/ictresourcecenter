<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Submissions | ICT Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div id="page-content" class="hidden">
    <div class="shell-heading">
      <h1>Submissions</h1>
      <p class="muted" id="page-sub">Assignment files uploaded by students.</p>
    </div>

    <div id="page-alert" aria-live="polite"></div>

    <div class="filter-bar">
      <div class="field">
        <label for="f-q">Student</label>
        <input class="input" id="f-q" type="search" placeholder="Search by name" autocomplete="off">
      </div>
      <div class="field">
        <label for="f-inst">Institution</label>
        <select class="select" id="f-inst"></select>
      </div>
      <div class="field">
        <label for="f-dept">Department</label>
        <select class="select" id="f-dept" disabled></select>
      </div>
      <div class="field">
        <label for="f-level">Level</label>
        <select class="select" id="f-level" disabled></select>
      </div>
      <div class="field">
        <label for="f-from">From</label>
        <input class="input" id="f-from" type="date">
      </div>
      <div class="field">
        <label for="f-to">To</label>
        <input class="input" id="f-to" type="date">
      </div>
    </div>
    <div class="btn-row filter-actions">
      <button type="button" class="btn btn-secondary btn-small" id="f-clear">Clear filters</button>
      <button type="button" class="btn btn-secondary btn-small" id="export-btn">Export to Excel</button>
    </div>
    <p class="hint" id="subs-count" aria-live="polite"></p>
    <div class="btn-row filter-actions">
      <button type="button" class="btn btn-secondary btn-small" id="zip-selected" disabled>Download selected as ZIP</button>
      <button type="button" class="btn btn-secondary btn-small" id="zip-all" disabled>Download all matching as ZIP</button>
    </div>

    <div id="subs-empty" class="card hidden"></div>

    <div class="table-wrap hidden" id="subs-wrap">
      <table class="table responsive students-table">
        <thead>
          <tr>
            <th class="col-check"><input type="checkbox" id="check-all" aria-label="Select all on this page"></th>
            <th>Uploaded</th>
            <th>Student</th>
            <th>Class</th>
            <th>File</th>
            <th><span class="sr-only">Actions</span></th>
          </tr>
        </thead>
        <tbody id="subs-body"></tbody>
      </table>
    </div>

    <div class="pager hidden" id="pager">
      <button type="button" class="btn btn-secondary btn-small" id="pager-prev">Previous</button>
      <span class="pager-info" id="pager-info"></span>
      <button type="button" class="btn btn-secondary btn-small" id="pager-next">Next</button>
    </div>
  </div>

  <script src="/js/ui.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/pages/submissions.js"></script>
</body>
</html>
